name: Bug report
description: Report reproducible behavior in Searchivo.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Use synthetic data and remove credentials."
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "Commit SHA and affected @searchivo package"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, TypeScript, Angular (if applicable), browser and OS versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps and a small synthetic dataset, or a repository link.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
