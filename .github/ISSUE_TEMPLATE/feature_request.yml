name: Feature proposal
description: Describe a use case and the smallest useful improvement.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you building, and where does the current API fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a small API example and observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Consider complexity, compatibility, ownership and performance.
