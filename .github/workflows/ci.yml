name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@11.28.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:example
      - run: pnpm build:website
      - run: node scripts/build-deploy.mjs
      - run: pnpm test:endpoints
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm audit --audit-level=low
      - name: Prepare and verify npm release artifacts
        run: |
          pnpm release:prepare
          release_sha="$(git rev-parse --short=12 HEAD)"
          release_dir="artifacts/release-0.1.0-$release_sha"
          unzip -q "$release_dir/searchivo-source-$release_sha.zip" -d "$RUNNER_TEMP/searchivo-release"
          node scripts/verify-extracted.mjs "$release_dir" "$RUNNER_TEMP/searchivo-release/searchivo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: searchivo-npm-0.1.0-${{ github.sha }}
          path: artifacts/release-0.1.0-*/
          if-no-files-found: error
